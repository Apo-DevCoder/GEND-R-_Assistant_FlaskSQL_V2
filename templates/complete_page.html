{% extends "base.html" %}

{% block content %}

<div class="title">
        <h3>Completer une intervention.</h3>
        <p>Completer et déclarer les impliqués.</p>
    </div>

    {% if success %}
        <div class="success-message" id="success-message">
            <p class="success">{{ success }}</p>
        </div>
    {% endif %}

    {% if error %}
        <div class="error-message" id="error-message">
            <p class="error">{{ error }}</p>
        </div>
    {% endif %}

{% endblock %}
